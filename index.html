<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/logo.png" />
    <!-- viewport-fit=cover: con la app instalada, la página llega hasta los
         bordes del iPhone y las barras fijas usan env(safe-area-inset-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Rapictrl</title>
    <!-- App instalable (PWA): ícono en la pantalla de inicio y pantalla completa.
         El color de la barra de estado lo ajusta themeService según el tema. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Rapictrl" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="description" content="Registra tus ingresos y gastos desde el celular en segundos." />
    <!-- Pre-paint del tema: aplica el modo oscuro ANTES de montar React para
         evitar el parpadeo (FOUC). Lee la caché local `qc-theme` y resuelve
         'system' contra prefers-color-scheme. Debe mantenerse en sintonía con
         src/services/theme/themeService.js -->
    <script>
      (function () {
        try {
          // Por defecto CLARO (no 'system'): quien no ha elegido tema debe ver
          // la app clara aunque su sistema operativo esté en oscuro. Quien sí
          // eligió tiene su valor en `qc-theme` y manda. Mantener en sintonía
          // con getStoredTheme() de src/services/theme/themeService.js.
          var mode = localStorage.getItem('qc-theme') || 'light';
          var isDark = mode === 'dark' ||
            (mode === 'system' && window.matchMedia &&
             window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          if (isDark) root.classList.add('dark');
          root.style.colorScheme = isDark ? 'dark' : 'light';
          root.setAttribute('data-theme', isDark ? 'dark' : 'light');
          // Barra de estado del celular del mismo color que el encabezado
          // (mismo valor que themeService.applyThemeToDom).
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', isDark ? '#30302e' : '#ffffff');
        } catch (e) { /* sin acceso a localStorage → tema claro por defecto */ }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Loader inicial: visible mientras se descarga y monta la app.
           React reemplaza el contenido de #root al renderizar, así que desaparece solo. -->
      <div id="initial-loader" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--qc-bg,#f9fafb);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;">
        <img src="/images/logo.png" alt="Rapictrl" style="height:48px;width:48px;object-fit:contain;" />
        <div style="width:38px;height:38px;border:4px solid #e5e7eb;border-top-color:#1d4ed8;border-radius:50%;animation:qc-initial-spin .8s linear infinite;"></div>
        <p style="font-size:13px;color:#9ca3af;margin:0;">Cargando…</p>
      </div>
      <style>@keyframes qc-initial-spin{to{transform:rotate(360deg)}}</style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
